<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CurrencyConverter</title>

    <!-- CSS -->
    <link rel="stylesheet" href="src/styles.css" />
  </head>

  <body>
    <!-- HEADER -->
    <header class="header">
      <div class="logo">CurrencyConverter</div>

      <nav class="nav">
        <button class="nav-toggle" aria-label="Toggle navigation">☰</button>

        <ul class="nav-menu">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>

          <!-- Auth buttons -->
          <li class="nav-login">
            <button id="openLogin" class="login-btn">Login</button>
          </li>
          <li class="nav-signup">
            <button class="signup-btn">Sign Up</button>
          </li>

          <!-- Logged-in links -->
          <li class="nav-dashboard" style="display: none">
            <a href="dashboard.html">Dashboard</a>
          </li>
          <li class="nav-logout" style="display: none">
            <button id="logoutBtn" class="login-btn">Logout</button>
          </li>
        </ul>
      </nav>
    </header>

    <!-- MAIN CONTENT -->
    <main class="container">
      <!-- LIVE BITCOIN PRICE -->
      <section id="btc-ticker">
        <h2>Live Bitcoin Price</h2>
        <p id="btcPrice">Loading...</p>
      </section>
      <!-- CONVERTER SECTION -->
      <section id="converter">
        <h1>Convert Currency to Cryptocurrency</h1>

        <p class="converter-subtitle">
          Get fast, real-time estimates for the world’s most popular
          cryptocurrencies.
        </p>

        <div class="converter">
          <input type="number" id="amount" placeholder="Enter amount" />

          <select id="currency">
            <option value="usd">USD</option>
            <option value="eur">EUR</option>
            <option value="gbp">GBP</option>
          </select>

          <select id="crypto">
            <option value="bitcoin">Bitcoin (BTC)</option>
            <option value="ethereum">Ethereum (ETH)</option>
            <option value="tether">Tether (USDT)</option>
            <option value="solana">Solana (SOL)</option>
            <option value="litecoin">Litecoin (LTC)</option>
          </select>

          <div class="quick-convert">
            <button data-crypto="bitcoin">BTC</button>
            <button data-crypto="ethereum">ETH</button>
            <button data-crypto="tether">USDT</button>
          </div>

          <button id="convertBtn">Convert</button>

          <p id="result"></p>
        </div>
      </section>
    </main>

    <!-- LOGIN MODAL -->
    <div class="modal-overlay" id="loginModal">
      <div class="modal">
        <button class="modal-x" aria-label="Close modal">&times;</button>

        <h2>Business Login</h2>

        <input type="email" placeholder="Business Email" />
        <input type="password" placeholder="Password" />

        <button class="primary-btn">Login</button>
        <button class="modal-close">Cancel</button>
      </div>
    </div>

    <!-- SIGN UP MODAL -->
<div class="modal-overlay" id="signupModal">
  <div class="modal">
    <button
      type="button"
      class="modal-x"
      aria-label="Close sign-up modal"
    >
      &times;
    </button>

    <h2>Create Your Account</h2>

    <input
      id="signupName"
      type="text"
      placeholder="Name or business name"
      autocomplete="organization"
    />

    <input
      id="signupEmail"
      type="email"
      placeholder="Email address"
      autocomplete="email"
    />

    <input
      id="signupPassword"
      type="password"
      placeholder="Password"
      autocomplete="new-password"
    />

    <input
      id="signupConfirmPassword"
      type="password"
      placeholder="Confirm password"
      autocomplete="new-password"
    />

    <p class="modal-message" id="signupMessage"></p>

    <button
      type="button"
      class="primary-btn"
      id="createAccountBtn"
    >
      Create Account
    </button>

    <button type="button" class="modal-close">
      Cancel
    </button>
  </div>
</div>

    <!-- JS -->
    <script src="src/script.js"></script>
  </body>
</html>
